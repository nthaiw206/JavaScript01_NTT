<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tính điểm trung bình</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <h1>Tính điểm trung bình</h1>

        <form id="scoreForm" novalidate>
            <div class="field">
                <label for="name">Tên sinh viên</label>
                <input type="text" id="name" placeholder="Nguyễn Văn A">
                <span class="error" id="err-name"></span>
            </div>

            <div class="grid">
                <div class="field">
                    <label for="s0">Giải tích 1</label>
                    <input type="number" id="s0" min="0" max="10" step="0.1">
                    <span class="error" id="err-s0"></span>
                </div>
                <div class="field">
                    <label for="s1">Đại số tuyến tính</label>
                    <input type="number" id="s1" min="0" max="10" step="0.1">
                    <span class="error" id="err-s1"></span>
                </div>
                <div class="field">
                    <label for="s2">Xác suất thống kê</label>
                    <input type="number" id="s2" min="0" max="10" step="0.1">
                    <span class="error" id="err-s2"></span>
                </div>
                <div class="field">
                    <label for="s3">Tin học đại cương</label>
                    <input type="number" id="s3" min="0" max="10" step="0.1">
                    <span class="error" id="err-s3"></span>
                </div>
                <div class="field">
                    <label for="s4">Xây dựng ứng dụng Web</label>
                    <input type="number" id="s4" min="0" max="10" step="0.1">
                    <span class="error" id="err-s4"></span>
                </div>
            </div>

            <button type="submit">Tính kết quả</button>
        </form>

        <section id="result" class="result" hidden aria-live="polite">
            <h2 id="resName"></h2>
            <table>
                <thead>
                    <tr>
                        <th>Môn học</th>
                        <th>Điểm</th>
                    </tr>
                </thead>
                <tbody id="resBody"></tbody>
                <tfoot>
                    <tr>
                        <td>Điểm trung bình</td>
                        <td id="resAvg"></td>
                    </tr>
                    <tr>
                        <td>Xếp loại</td>
                        <td id="resRank"></td>
                    </tr>
                </tfoot>
            </table>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
